name: Build and test Windows x64 installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-x64-installer

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      npm_config_arch: x64
      VSCODE_ARCH: x64

    steps:
      - name: Check out Orbyte
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        shell: pwsh
        run: npm install --global pnpm@12.16.0

      - name: Resolve pnpm store
        id: pnpm-store
        shell: pwsh
        run: "\"path=$((pnpm store path --silent))\" | Out-File -FilePath $env:GITHUB_OUTPUT -Append"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-windows-x64-${{ hashFiles('pnpm-lock.yaml', 'build/pnpm-lock.yaml', 'extensions/copilot/pnpm-lock.yaml') }}
          restore-keys: pnpm-windows-x64-

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Add Windows SDK tools to PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem -Path (Join-Path $sdkBin '*\x64\signtool.exe') -File |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "Could not find the x64 Windows SDK signtool.exe under $sdkBin."
          }
          $signTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Using Windows SDK tools from $($signTool.DirectoryName)"

      - name: Package native Windows x64 application
        shell: pwsh
        run: pnpm run orbyte:build:windows:x64

      - name: Build per-user installer
        shell: pwsh
        run: pnpm run orbyte:installer:windows:x64

      - name: Validate, install, and launch Orbyte
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $portableDir = (Resolve-Path '..\VSCode-win32-x64').Path
          $installer = (Resolve-Path '.build\win32-x64\user-setup\VSCodeSetup.exe').Path
          $artifactDir = Join-Path $PWD 'windows-x64-artifacts'
          $installDir = Join-Path $env:RUNNER_TEMP 'OrbyteSmokeTest'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          function Get-PeMachine([string] $Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "$Path is not a Windows PE executable."
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          function Assert-WindowsPe([string] $Path) {
            $machine = Get-PeMachine $Path
            if ($machine -notin 0x014c, 0x8664) {
              throw ("{0} has an unsupported PE machine type (0x{1:x4})." -f $Path, $machine)
            }
          }

          function Assert-X64Pe([string] $Path) {
            $machine = Get-PeMachine $Path
            if ($machine -ne 0x8664) {
              throw ("{0} is not Windows x64 (machine 0x{1:x4})." -f $Path, $machine)
            }
          }

          # Inno Setup uses an x86 bootstrap executable even when its installed
          # application payload is x64. Validate the bootstrap as Windows PE,
          # then enforce x64 on Orbyte.exe before and after installation.
          Assert-WindowsPe $installer
          $portableExe = Join-Path $portableDir 'Orbyte.exe'
          if (-not (Test-Path $portableExe)) {
            throw "Portable Orbyte.exe was not generated."
          }
          Assert-X64Pe $portableExe
          Write-Host 'Validated the installer bootstrap and portable x64 executable.'

          $bundledModels = Get-ChildItem $portableDir -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Extension -in '.gguf', '.safetensors' }
          if ($bundledModels) {
            throw "The package unexpectedly contains local LLM model files: $($bundledModels.FullName -join ', ')"
          }
          Write-Host 'Confirmed that no local LLM model files are bundled.'

          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }
          Write-Host "Installing Orbyte into $installDir ..."
          $setup = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$installDir"
          ) -PassThru
          if (-not $setup.WaitForExit(600000)) {
            $setup.Kill($true)
            throw 'The installer did not finish within 10 minutes.'
          }
          if ($setup.ExitCode -ne 0) {
            throw "The installer exited with code $($setup.ExitCode)."
          }
          Write-Host 'The silent installation completed successfully.'

          $installedExe = Join-Path $installDir 'Orbyte.exe'
          if (-not (Test-Path $installedExe)) {
            throw "The installer completed but Orbyte.exe is missing from $installDir."
          }
          Assert-X64Pe $installedExe

          $stdout = Join-Path $env:RUNNER_TEMP 'orbyte-version.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'orbyte-version-error.txt'
          Write-Host 'Launching the installed Orbyte executable with --version ...'
          $launch = Start-Process -FilePath $installedExe -ArgumentList '--version' `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $launch.WaitForExit(60000)) {
            $launch.Kill($true)
            throw 'Installed Orbyte did not finish the --version check within 60 seconds.'
          }
          $launch.WaitForExit()
          if ($launch.ExitCode -ne 0) {
            $errorText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            throw "Installed Orbyte failed to launch (exit $($launch.ExitCode)): $errorText"
          }

          # A Windows GUI-subsystem executable can exit successfully without
          # forwarding stdout. Exercise the installed CLI wrapper as well so
          # the version assertion is independent of GUI stdout behavior.
          $installedCli = Join-Path $installDir 'bin\orbyte.cmd'
          if (-not (Test-Path $installedCli)) {
            throw "The installer completed but the Orbyte CLI is missing from $installedCli."
          }
          $cliOutput = & $installedCli --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "The installed Orbyte CLI failed with exit $LASTEXITCODE: $($cliOutput -join [Environment]::NewLine)"
          }
          $versionText = ($cliOutput | Out-String).Trim()
          if (-not $versionText) {
            throw 'The installed Orbyte CLI returned no version.'
          }
          Write-Host "Installed Orbyte version: $versionText"

          $publishedInstaller = Join-Path $artifactDir 'OrbyteUserSetup-x64.exe'
          Copy-Item $installer $publishedInstaller -Force
          $hash = (Get-FileHash $publishedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OrbyteUserSetup-x64.exe" | Set-Content `
            (Join-Path $artifactDir 'OrbyteUserSetup-x64.sha256') -Encoding ascii

      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbyte-Windows-x64-tested-installer
          path: windows-x64-artifacts/*
          if-no-files-found: error
          retention-days: 14
